<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - Grok 注册机控制台</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0b0d12;--panel:#151821;--border:#2b3040;--text:#f4f4f5;--muted:#a1a1aa;--accent:#4f46e5;--danger:#ef4444}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
main{width:min(380px,100%);border:1px solid var(--border);background:var(--panel);padding:24px;border-radius:8px}
h1{font-size:18px;margin:0 0 20px;letter-spacing:0}
label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}
input{width:100%;height:42px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);padding:0 12px;font:14px ui-monospace,SFMono-Regular,Menlo,monospace}
input:focus{outline:none;border-color:var(--accent)}
button{width:100%;height:42px;margin-top:16px;border:0;border-radius:6px;background:var(--accent);color:white;font-weight:650;cursor:pointer}
.error{color:var(--danger);font-size:12px;margin:12px 0 0}
</style>
</head>
<body>
<main>
  <h1>Grok 注册机控制台</h1>
  <form method="post" autocomplete="off">
    <label for="token">访问令牌</label>
    <input id="token" name="token" type="password" required autofocus>
    <button type="submit">登录</button>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </form>
</main>
</body>
</html>
